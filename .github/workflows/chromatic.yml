name: Chromatic

# 토큰 값을 바꾸는 PR 은 코드 리뷰로 판정할 수 없다 — 판정 대상이 "무엇이 어떻게 보이는가"
# 이기 때문이다. 이 잡이 그 자리를 대신한다: 스토리북을 렌더해 기준선과 대조하고, 달라진
# 것이 있으면 Chromatic 에서 사람이 승인할 때까지 실패로 둔다.
#
# `exitZeroOnChanges` 를 켜지 않는 것이 핵심이다. 켜면 diff 가 나도 초록이 되어
# "아무도 안 본 변경"이 그대로 머지된다.
#
# CHROMATIC_PROJECT_TOKEN 시크릿이 없으면 이 잡은 실패하지 않고 건너뛴다 —
# 토큰 발급 전에 CI 를 빨갛게 만들지 않기 위해서다. 토큰이 붙으면 자동으로 동작한다.

on:
  pull_request:
  push:
    branches: [main]
  # 기준선을 다시 잡아야 할 때 쓴다. 첫 빌드는 자동 승인되어 기준선이 되는데,
  # 그 빌드가 어느 브랜치에서 찍혔느냐에 따라 이후 diff 의 의미가 달라진다.
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

env:
  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the project token
        id: gate
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_PROJECT_TOKEN 이 없어 시각 회귀 검사를 건너뜁니다. 조직 관리자가 시크릿을 추가하면 자동으로 동작합니다."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          # Chromatic 은 기준선을 찾으려고 커밋 이력을 거슬러 올라간다.
          # 얕은 클론이면 모든 스토리를 신규로 보고 전량 diff 를 낸다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.configured == 'true'

      - name: Publish to Chromatic
        if: steps.gate.outputs.configured == 'true'
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          onlyChanged: true
