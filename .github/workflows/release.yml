name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing(OIDC) 은 npm CLI 11.5.1 이상이 필요하다. Node 24 번들 npm 이
      # 그보다 낮을 수 있어 올린다. 토큰 없이 GitHub OIDC(id-token: write)로 배포한다.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version Packages" PR when changesets are pending.
      # Merging that PR runs this workflow again with no changesets left, which
      # is when `publish` actually ships to npm and pushes the tags.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN 은 쓰지 않는다 — 배포 권한은 npmjs.com 의 Trusted Publisher 설정이 준다.
          NPM_CONFIG_PROVENANCE: "true"
